<svg width="1280" height="1080" viewBox="0 0 1280 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Vishesh Agarwal technical systems dossier</title>
<desc id="desc">A dark layered engineering profile showing verified systems, technology stack, platforms, execution paths and current learning direction.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05080c"/>
    <stop offset=".45" stop-color="#09111a"/>
    <stop offset="1" stop-color="#05070a"/>
  </linearGradient>
  <linearGradient id="heroGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3ddc97" stop-opacity=".8"/>
    <stop offset=".55" stop-color="#58a6ff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#d2a8ff" stop-opacity=".15"/>
  </linearGradient>
  <radialGradient id="halo" cx=".72" cy=".12" r=".7">
    <stop offset="0" stop-color="#2f81f7" stop-opacity=".16"/>
    <stop offset=".45" stop-color="#3ddc97" stop-opacity=".05"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#22303d" stroke-opacity=".22" stroke-width="1"/>
  </pattern>
  <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r=".45" fill="#607286" fill-opacity=".16"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1280" height="1080" rx="22" fill="url(#bg)"/>
<rect width="1280" height="1080" rx="22" fill="url(#halo)"/>
<rect x="18" y="18" width="1244" height="1044" rx="18" fill="url(#grid)" opacity=".35"/>
<rect x="18" y="18" width="1244" height="1044" rx="18" fill="url(#micro)" opacity=".35"/>
<rect x="1" y="1" width="1278" height="1078" rx="21" fill="none" stroke="#1d2a35"/>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <!-- top rail -->
  <text x="42" y="42" fill="#607286" font-size="12">~/profile/system-dossier</text>
  <text x="1058" y="42" fill="#607286" font-size="12">BUILD  TRACE  LEARN</text>
  <line x1="42" y1="58" x2="1238" y2="58" stroke="#18232d"/>

  <!-- identity -->
  <text x="42" y="108" fill="#f0f6fc" font-size="38" font-weight="700" letter-spacing="3">VISHESH AGARWAL</text>
  <text x="42" y="142" fill="#a6b4c2" font-size="15">software engineering student · builder · moving deeper through the stack</text>
  <rect x="42" y="164" width="485" height="42" rx="8" fill="#0b141c" stroke="#203241"/>
  <text x="60" y="190" fill="#d6e0e8" font-size="13">“build the abstraction → trace the path → understand what is underneath”</text>

  <!-- layered stack sculpture -->
  <g transform="translate(690 78)">
    <path d="M85 15 L355 15 L445 60 L175 60 Z" fill="#0f1922" stroke="#284052"/>
    <path d="M68 72 L372 72 L467 120 L163 120 Z" fill="#0d1720" stroke="#284052"/>
    <path d="M50 133 L390 133 L490 184 L150 184 Z" fill="#0b151d" stroke="#284052"/>
    <path d="M31 198 L409 198 L514 252 L136 252 Z" fill="#09131a" stroke="#284052"/>
    <path d="M12 266 L428 266 L538 323 L122 323 Z" fill="#071017" stroke="#284052"/>

    <path d="M85 15 L355 15" stroke="#3ddc97" stroke-width="2.2" filter="url(#glow)"/>
    <path d="M68 72 L372 72" stroke="#58a6ff" stroke-width="2"/>
    <path d="M50 133 L390 133" stroke="#7ee787" stroke-width="2"/>
    <path d="M31 198 L409 198" stroke="#d2a8ff" stroke-width="2"/>
    <path d="M12 266 L428 266" stroke="#ff9f43" stroke-width="2"/>

    <text x="205" y="42" fill="#e7eef4" font-size="12">APPLICATION</text>
    <text x="202" y="101" fill="#c6d1da" font-size="12">BROWSER / RUNTIME</text>
    <text x="194" y="164" fill="#c6d1da" font-size="12">BACKEND / CONTROL</text>
    <text x="183" y="231" fill="#c6d1da" font-size="12">DATA / NETWORK</text>
    <text x="170" y="301" fill="#c6d1da" font-size="12">OS / INFRA</text>
  </g>

  <!-- signal rail -->
  <rect x="42" y="234" width="575" height="150" rx="12" fill="#091118" stroke="#1f3140"/>
  <text x="62" y="262" fill="#647586" font-size="12">CURRENT SIGNAL</text>
  <text x="62" y="296" fill="#3ddc97" font-size="13" font-weight="700">BUILD</text>
  <text x="130" y="296" fill="#d3dde6" font-size="13">browser tooling · reconciliation systems · automation</text>
  <text x="62" y="328" fill="#58a6ff" font-size="13" font-weight="700">TRACE</text>
  <text x="130" y="328" fill="#d3dde6" font-size="13">auth · state · queues · HTTP · deployment paths</text>
  <text x="62" y="360" fill="#d2a8ff" font-size="13" font-weight="700">LEARN</text>
  <text x="130" y="360" fill="#d3dde6" font-size="13">OS · networks · distributed systems · DB internals</text>

  <!-- section label -->
  <line x1="42" y1="412" x2="1238" y2="412" stroke="#17212b"/>
  <text x="42" y="444" fill="#647586" font-size="12">VERIFIED SYSTEMS</text>

  <!-- SettleWise panel -->
  <rect x="42" y="468" width="582" height="210" rx="14" fill="#0a1219" stroke="#214032"/>
  <rect x="42" y="468" width="4" height="210" rx="2" fill="#3ddc97"/>
  <text x="66" y="505" fill="#f0f6fc" font-size="22" font-weight="700">SETTLEWISE AI</text>
  <text x="66" y="531" fill="#91a2b2" font-size="12">verification-first settlement reconciliation</text>
  <text x="66" y="568" fill="#7ee787" font-size="12">INGEST → MATCH+GATES → SQLITE → REVIEW → AUDIT</text>
  <text x="66" y="602" fill="#c6d1da" font-size="12">123 / 146 auto · 84.25% recall · 100% precision · 0 false positives</text>
  <text x="66" y="630" fill="#8799a9" font-size="12">deterministic evidence · integer-paise math · SHA-256 audit chain</text>
  <text x="66" y="657" fill="#617485" font-size="11">React 19 · Express 5 · SQLite · Vercel · Railway</text>

  <!-- LeetGitSync panel -->
  <rect x="646" y="468" width="592" height="210" rx="14" fill="#0a1219" stroke="#29405a"/>
  <rect x="646" y="468" width="4" height="210" rx="2" fill="#58a6ff"/>
  <text x="670" y="505" fill="#f0f6fc" font-size="22" font-weight="700">LEETGITSYNC</text>
  <text x="670" y="531" fill="#91a2b2" font-size="12">browser-only LeetCode → GitHub synchronization</text>
  <text x="670" y="568" fill="#58a6ff" font-size="12">PAGE → CONTENT BRIDGE → MV3 WORKER → RETRY QUEUE → GITHUB</text>
  <text x="670" y="602" fill="#c6d1da" font-size="12">WXT · Manifest V3 · React · deterministic paths · SHA-aware writes</text>
  <text x="670" y="630" fill="#8799a9" font-size="12">capture / queue / writer / README / foundation test suites</text>
  <text x="670" y="657" fill="#617485" font-size="11">Brave · Chrome · Edge · Firefox</text>

  <!-- lower modules -->
  <rect x="42" y="700" width="366" height="138" rx="12" fill="#091118" stroke="#3a3150"/>
  <text x="64" y="734" fill="#f0f6fc" font-size="17" font-weight="700">ALGORITHM STREAM</text>
  <text x="64" y="766" fill="#d2a8ff" font-size="12">Java + SQL solutions</text>
  <text x="64" y="793" fill="#9aaab8" font-size="12">topic-indexed through LeetGitSync</text>
  <text x="64" y="817" fill="#617485" font-size="11">DSA · trees · graphs · DP · segment trees</text>

  <rect x="428" y="700" width="382" height="138" rx="12" fill="#091118" stroke="#4a3925"/>
  <text x="450" y="734" fill="#f0f6fc" font-size="17" font-weight="700">CERTISYNC / CREDVAULT</text>
  <text x="450" y="766" fill="#ff9f43" font-size="12">architecture blueprint</text>
  <text x="450" y="793" fill="#9aaab8" font-size="12">OCR → perceptual hash → SQLite → GitHub sync</text>
  <text x="450" y="817" fill="#617485" font-size="11">design documentation, not shipped code</text>

  <rect x="830" y="700" width="408" height="138" rx="12" fill="#091118" stroke="#263746"/>
  <text x="852" y="734" fill="#f0f6fc" font-size="17" font-weight="700">PLATFORMS</text>
  <text x="852" y="766" fill="#7ee787" font-size="12">Linux · GitHub · Vercel · Railway</text>
  <text x="852" y="793" fill="#58a6ff" font-size="12">AWS · GCP · browser-extension runtime</text>
  <text x="852" y="817" fill="#617485" font-size="11">cloud labs · deployment · local/runtime tooling</text>

  <!-- stack strip -->
  <line x1="42" y1="868" x2="1238" y2="868" stroke="#17212b"/>
  <text x="42" y="900" fill="#647586" font-size="12">STACK / LAYERS</text>

  <text x="42" y="934" fill="#3ddc97" font-size="12" font-weight="700">LANG</text>
  <text x="96" y="934" fill="#cbd5df" font-size="12">Java · JavaScript · Python · SQL</text>
  <text x="374" y="934" fill="#58a6ff" font-size="12" font-weight="700">WEB</text>
  <text x="418" y="934" fill="#cbd5df" font-size="12">React · Vite · Tailwind · Node.js · Express</text>
  <text x="820" y="934" fill="#d2a8ff" font-size="12" font-weight="700">DATA</text>
  <text x="874" y="934" fill="#cbd5df" font-size="12">SQLite · MongoDB · Pandas · NumPy</text>

  <text x="42" y="966" fill="#ff9f43" font-size="12" font-weight="700">ML</text>
  <text x="76" y="966" fill="#cbd5df" font-size="12">scikit-learn · TensorFlow · PyTorch</text>
  <text x="374" y="966" fill="#7ee787" font-size="12" font-weight="700">TOOLING</text>
  <text x="448" y="966" fill="#cbd5df" font-size="12">WXT · MV3 · Git · Postman · Power BI · Excel</text>

  <!-- footer route -->
  <path d="M42 1006 H260 C320 1006 310 1032 372 1032 H910 C972 1032 970 1006 1032 1006 H1238" fill="none" stroke="url(#heroGlow)" stroke-width="1.5"/>
  <circle cx="42" cy="1006" r="4" fill="#3ddc97"/>
  <circle cx="1238" cy="1006" r="4" fill="#58a6ff"/>
  <text x="42" y="1044" fill="#516273" font-size="11">verified builds above · study direction below · no fake mastery · no external trackers</text>
  <text x="1090" y="1044" fill="#516273" font-size="11">dossier:v4</text>
</g>
</svg>