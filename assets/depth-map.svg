<svg width="1280" height="620" viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Vishesh Agarwal — computing depth map</title>
<desc id="desc">A technical map showing how Vishesh's projects cross application, browser runtime, backend, data, network and infrastructure layers.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b10"/>
    <stop offset="0.55" stop-color="#0b1118"/>
    <stop offset="1" stop-color="#070a0e"/>
  </linearGradient>
  <linearGradient id="lineA" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#42d392"/>
    <stop offset="1" stop-color="#58a6ff"/>
  </linearGradient>
  <linearGradient id="lineB" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff9f43"/>
    <stop offset="1" stop-color="#d2a8ff"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1280" height="620" rx="18" fill="url(#bg)"/>
<rect x="1" y="1" width="1278" height="618" rx="17" fill="none" stroke="#1f2a36"/>

<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
