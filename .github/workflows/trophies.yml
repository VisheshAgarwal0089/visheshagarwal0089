name: Generate profile trophies

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trophies.yml"
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: VisheshAgarwal0089
          output_path: assets/trophies.svg
          token: ${{ github.token }}
          theme: discord

      - name: Commit trophy SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophies.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(profile): refresh trophies"
          git push
